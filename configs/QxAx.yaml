question_field: "m_query"

languages:
  bn:
    prompt: |
      সমস্যা: {question}
      সমস্যাটি বাংলায় সমাধান করুন এবং উত্তরের শেষে চূড়ান্ত সংখ্যাটিকে $\boxed{{}}$ এর মধ্যে লিখুন।

  de:
    prompt: |
      Aufgabe: {question}
      Lösen Sie die Aufgabe auf Deutsch und geben Sie die endgültige Zahl am Ende der Antwort in $\boxed{{}}$ an.

  es:
    prompt: |
      Problema: {question}
      Resuelva el problema en español y encierre el número final al final de la respuesta en $\boxed{{}}$.

  fr:
    prompt: |
      Problème : {question}
      Résolvez le problème en français et encadrez le nombre final à la fin de la réponse dans $\boxed{{}}$.

  ja:
    prompt: |
      問題: {question}
      問題を日本語で解き、最終的な数値を回答の最後に $\boxed{{}}$ で囲んでください。

  ru:
    prompt: |
      Задача: {question}
      Решите задачу на русском языке и заключите окончательное числовое значение в конце ответа в $\boxed{{}}$.

  th:
    prompt: |
      โจทย์: {question}
      แก้โจทย์เป็นภาษาไทย และใส่คำตอบตัวเลขสุดท้ายไว้ใน $\boxed{{}}$ ตอนท้ายของคำตอบ

  en:
    prompt: |
      Problem: {question}
      Solve the problem and enclose the final number at the end of the response in $\boxed{{}}$.
